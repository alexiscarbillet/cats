name: Weekly Article Generator

on:
  schedule:
    # Runs every Saturday at 6 PM UTC (adjust timezone as needed)
    - cron: '0 18 * * 6'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  generate-article:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai
      
      - name: Generate and commit article
        run: python scripts/generate_article.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: Auto-generated weekly cat article"
            git push
          fi
